<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="circuit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f3460"/>
      <stop offset="100%" style="stop-color:#533483"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="128" height="128" rx="24" fill="url(#bg)"/>
  <!-- Circuit board pattern -->
  <g stroke="#4ecca3" stroke-width="1.5" fill="none" opacity="0.3">
    <path d="M20 40 H40 V60 H60"/>
    <path d="M40 40 V20"/>
    <path d="M60 60 V80 H80"/>
    <path d="M80 40 H100 V60"/>
    <path d="M100 60 V80"/>
    <path d="M20 80 H40 V100"/>
    <path d="M80 80 H100"/>
    <!-- Nodes -->
    <circle cx="40" cy="40" r="3" fill="#4ecca3"/>
    <circle cx="60" cy="60" r="3" fill="#4ecca3"/>
    <circle cx="80" cy="40" r="3" fill="#4ecca3"/>
    <circle cx="100" cy="60" r="3" fill="#4ecca3"/>
    <circle cx="40" cy="80" r="3" fill="#4ecca3"/>
    <circle cx="80" cy="80" r="3" fill="#4ecca3"/>
  </g>
  <!-- Chip/IC -->
  <rect x="38" y="48" width="24" height="24" rx="2" fill="#4ecca3" opacity="0.9"/>
  <rect x="42" y="52" width="16" height="16" rx="1" fill="#1a1a2e"/>
  <!-- Pins on chip -->
  <g fill="#4ecca3">
    <rect x="40" y="52" width="4" height="2"/>
    <rect x="56" y="52" width="4" height="2"/>
    <rect x="40" y="66" width="4" height="2"/>
    <rect x="56" y="66" width="4" height="2"/>
    <rect x="52" y="48" width="2" height="4"/>
    <rect x="52" y="66" width="2" height="4"/>
  </g>
  <!-- Lightning bolt (power/energy) -->
  <path d="M70 25 L65 42 L73 42 L68 58" stroke="#e94560" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Mobile device silhouette -->
  <rect x="85" y="72" width="16" height="28" rx="3" fill="none" stroke="#0f3460" stroke-width="1.5"/>
  <rect x="89" y="76" width="8" height="18" rx="1" fill="#0f3460" opacity="0.5"/>
  <circle cx="93" cy="96" r="1.5" fill="#0f3460"/>
  <!-- Soldering iron tip -->
  <path d="M22 95 L30 80 L34 82 L26 97 Z" fill="#e94560" opacity="0.7"/>
  <!-- Text: HB -->
  <text x="64" y="118" text-anchor="middle" font-family="monospace" font-weight="bold" font-size="14" fill="#4ecca3">HB</text>
</svg>
