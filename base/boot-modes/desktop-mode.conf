# HybridBench OS - Desktop Mode Configuration
# Standard Linux desktop environment

[BootMode]
Name=Desktop
Description=Standard Linux desktop for general use
Icon=computer

[Services]
# Enable standard desktop services
enable=NetworkManager,lightdm,pulseaudio,ssh

# Disable electronics-specific services
disable=electronics-bench,mobile-service,power-supply

[Packages]
# Load desktop packages only
install=01-base-system

[Environment]
HYBRIDBENCH_MODE=desktop
HYBRIDBENCH_GUI=enable

[Autostart]
# Start desktop environment
command=openbox-session
