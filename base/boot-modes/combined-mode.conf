# HybridBench OS - Combined Mode Configuration
# All features loaded - full bench operation

[BootMode]
Name=Combined
Description=All features - mobile service + electronics bench
Icon=settings

[Services]
# Enable all services
enable=NetworkManager,lightdm,pulseaudio,usbmuxd,adb,sigrok,power-supply

# Enable all containers
enable-containers=android-tools,apple-tools,qualcomm-edl,mediatek-flash,samsung-odin

[Packages]
# Load all packages
install=01-base-system,02-electronics,03-mobile-service

[Environment]
HYBRIDBENCH_MODE=combined
HYBRIDBENCH_GUI=enable
HYBRIDBENCH_REALTIME=enable
HYBRIDBENCH_USB_AUTOLOAD=enable

[Hardware]
# Enable all hardware interfaces
gpio=enable
jtag=enable
swd=enable
uart=enable

# Real-time priority for signal analysis
realtime_priority=enable

[DeviceDetection]
# Auto-detect and load appropriate containers
auto_detect=enable
container_isolation=enable

[Autostart]
# Start combined environment
command=/opt/hybridbench/bin/combined-init
