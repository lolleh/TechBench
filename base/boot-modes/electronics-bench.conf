# HybridBench OS - Electronics Bench Mode Configuration
# Optimized for electronics engineering and instrument control

[BootMode]
Name=Electronics Bench
Description=Electronics instruments with logic analyzer, oscilloscope, and PSU control
Icon=circuit

[Services]
# Enable electronics-specific services
enable=NetworkManager,lightdm,pulseaudio,sigrok,power-supply

# Disable mobile-specific services
disable=mobile-service,usbmuxd,adb

[Packages]
# Load electronics packages
install=01-base-system,02-electronics

[Environment]
HYBRIDBENCH_MODE=electronics-bench
HYBRIDBENCH_GUI=enable
HYBRIDBENCH_REALTIME=enable

[Hardware]
# Enable GPIO/JTAG/SWD interfaces
gpio=enable
jtag=enable
swd=enable
uart=enable

# Real-time priority for signal analysis
realtime_priority=enable

[Autostart]
# Start electronics bench environment
command=/opt/hybridbench/bin/electronics-init
