# HybridBench OS - Mobile Service Mode Configuration
# Optimized for mobile device servicing

[BootMode]
Name=Mobile Service
Description=Mobile device servicing with ADB, Fastboot, and vendor tools
Icon=phone

[Services]
# Enable mobile service services
enable=NetworkManager,lightdm,pulseaudio,usbmuxd,adb

# Enable container runtime for vendor tools
enable-containers=android-tools,apple-tools,qualcomm-edl,mediatek-flash,samsung-odin

# Disable electronics-specific services
disable=electronics-bench,power-supply

[Packages]
# Load mobile service packages
install=01-base-system,03-mobile-service

[Environment]
HYBRIDBENCH_MODE=mobile-service
HYBRIDBENCH_GUI=enable
HYBRIDBENCH_USB_AUTOLOAD=enable

[DeviceDetection]
# Auto-detect and load appropriate containers
auto_detect=enable
container_isolation=enable

[Autostart]
# Start mobile service environment
command=/opt/hybridbench/bin/mobile-service-init
