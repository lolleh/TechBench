[package]
name = "techbench-db"
version = "0.1.0"
edition = "2021"
description = "Database service for TechBench"
license = "GPL-3.0"

[dependencies]
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
log = "0.4"
env_logger = "0.11"
thiserror = "1"
chrono = { version = "0.4", features = ["serde"] }

[lib]
name = "techbench_db"
path = "src/lib.rs"
